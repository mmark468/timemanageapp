    linear-gradient(180deg, #211b17 0%, #181512 58%, #151311 100%);
}

.theme-light .app-phone-frame,
.theme-dark .app-phone-frame {
  background: var(--phone-bg) !important;
  border-color: var(--line) !important;
  box-shadow: var(--warm-shadow) !important;
}

.theme-light .text-ink,
.theme-dark .text-ink {
  color: var(--ink) !important;
}

.theme-light .text-muted,
.theme-dark .text-muted {
  color: var(--muted) !important;
}

.theme-light .bg-ink,
.theme-dark .bg-ink {
  background: var(--accent-2) !important;
}

.theme-light button.bg-ink,
.theme-light a.bg-ink {
  background: var(--accent-2) !important;
  color: #fffaf5 !important;
}

.theme-dark button.bg-ink,
.theme-dark a.bg-ink {
  background: var(--accent) !important;
  color: #201713 !important;
}

.theme-light .bg-white,
.theme-light .bg-white\/70,
.theme-light .bg-white\/75,
.theme-light .bg-white\/80,
.theme-light .bg-white\/85,
.theme-light .bg-white\/90,
.theme-light .bg-white\/95,
.theme-dark .bg-white,
.theme-dark .bg-white\/70,
.theme-dark .bg-white\/75,
.theme-dark .bg-white\/80,
.theme-dark .bg-white\/85,
.theme-dark .bg-white\/90,
.theme-dark .bg-white\/95 {
  background-color: var(--surface) !important;
  border-color: var(--line) !important;
}

.theme-light .bg-cream,
.theme-light .bg-sky,
.theme-light .bg-skySoft,
.theme-light .bg-lemon,
.theme-light .bg-peach,
.theme-light .bg-mint,
.theme-light .bg-lavender,
.theme-dark .bg-cream,
.theme-dark .bg-sky,
.theme-dark .bg-skySoft,
.theme-dark .bg-lemon,
.theme-dark .bg-peach,
.theme-dark .bg-mint,
.theme-dark .bg-lavender {
  background-color: var(--surface-soft) !important;
}

.theme-light .shadow-soft,
.theme-dark .shadow-soft {
  box-shadow: var(--warm-shadow) !important;
}

.theme-light .shadow-pill,
.theme-dark .shadow-pill {
  box-shadow: var(--pill-shadow) !important;
}

.theme-light input,
.theme-light select,
.theme-light textarea,
.theme-dark input,
.theme-dark select,
.theme-dark textarea {
  color: var(--ink);
  border: 1px solid var(--line);
}

.theme-light input::placeholder,
.theme-light textarea::placeholder,
.theme-dark input::placeholder,
.theme-dark textarea::placeholder {
  color: color-mix(in srgb, var(--muted) 74%, transparent);
}

.theme-light nav,
.theme-dark nav {
  background: color-mix(in srgb, var(--surface-strong) 86%, transparent) !important;
  border: 1px solid var(--line) !important;
  box-shadow: var(--warm-shadow) !important;
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
}

.theme-light nav > div,
.theme-dark nav > div {
  background: var(--surface-soft) !important;
}

.theme-light nav button.bg-ink,
.theme-dark nav button.bg-ink {
  background: var(--accent) !important;
  color: #fffaf5 !important;
}

.theme-dark nav button.bg-ink {
  color: #201713 !important;
}

.quick-stat:nth-child(1) {
  background: linear-gradient(145deg, var(--surface-strong) 0%, #fff4ec 100%) !important;
}

.quick-stat:nth-child(2) {
  background: linear-gradient(145deg, var(--surface-strong) 0%, var(--accent-2-soft) 100%) !important;
}

.quick-stat:nth-child(3) {
  background: linear-gradient(145deg, var(--surface-strong) 0%, #f2f7ff 100%) !important;
}

.theme-dark .quick-stat:nth-child(1),
.theme-dark .quick-stat:nth-child(2),
.theme-dark .quick-stat:nth-child(3) {
  background: linear-gradient(145deg, var(--surface) 0%, var(--surface-soft) 100%) !important;
}

.subject-card {
  background:
    linear-gradient(145deg, color-mix(in srgb, var(--surface-strong) 78%, transparent) 0%, color-mix(in srgb, var(--surface-strong) 54%, transparent) 58%, var(--subject-card-color) 100%),
    var(--subject-card-color) !important;
  border: 1px solid var(--line);
}

.subject-card .h-2,
.subject-card [class*="h-2"][class*="rounded-full"] {
  background-color: color-mix(in srgb, var(--surface-strong) 70%, transparent) !important;
}

.visual-style-card {
  border: 1px solid var(--line);
}

.visual-style-card.is-active {
  background: var(--accent-2) !important;
  color: #fffaf5 !important;
}

.theme-dark .visual-style-card.is-active {
  background: var(--accent) !important;
  color: #201713 !important;
}

.study-icon {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  color: var(--ink, #2f2a25);
  background: var(--surface-strong, #fffaf5);
  border: 1px solid var(--line, rgba(82, 65, 51, 0.11));
  box-shadow: var(--pill-shadow, 0 10px 22px rgba(120, 85, 54, 0.1));
}

.study-icon--sm {
  width: 40px;
  height: 40px;
  border-radius: 15px;
}

.study-icon--md {
  width: 48px;
  height: 48px;
  border-radius: 18px;
}

.study-icon--lg {
  width: 64px;
  height: 64px;
  border-radius: 24px;
}

.study-icon--selected {
  box-shadow:
    var(--pill-shadow, 0 10px 22px rgba(120, 85, 54, 0.1)),
    inset 0 0 0 2px var(--accent-2, #2d5a4b);
}

.calendar-page {
  background: transparent !important;
}

.calendar-overview-card {
  color: #fffaf5;
  background:
    radial-gradient(140% 90% at 0% 0%, rgba(255, 244, 232, 0.22), transparent 50%),
    linear-gradient(135deg, var(--accent) 0%, #b86d4c 46%, var(--accent-2) 100%);
}

.theme-dark .calendar-overview-card {
  background:
    radial-gradient(140% 90% at 0% 0%, rgba(255, 232, 210, 0.14), transparent 52%),
    linear-gradient(135deg, #7b4c35 0%, #5a372b 44%, #24483d 100%);
}

.calendar-today-button {
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.26);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.calendar-month-button {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border-radius: 999px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--pill-shadow);
}

.calendar-gantt-card,
.calendar-detail-card {
  background: var(--surface) !important;
  border-color: var(--line) !important;
}

.calendar-date-strip {
  background: color-mix(in srgb, var(--surface-strong) 72%, transparent);
}

.calendar-date-pill {
  border-color: var(--line) !important;
  background: var(--surface-soft) !important;
}

.calendar-date-pill-active {
  background: var(--accent-2) !important;
  border-color: var(--accent-2) !important;
  color: #fffaf5 !important;
  box-shadow: var(--pill-shadow);
}

.theme-dark .calendar-date-pill-active {
  background: var(--accent) !important;
  border-color: var(--accent) !important;
  color: #201713 !important;
}

.calendar-date-pill-holiday {
  background: var(--accent-2-soft) !important;
}

.calendar-date-pill-weekend {
  background: color-mix(in srgb, var(--surface-soft) 72%, var(--surface-strong)) !important;
}

.calendar-time-column,
.calendar-timeline-surface {
  background: var(--surface-strong) !important;
}

.calendar-timeline-weekend {
  background: color-mix(in srgb, var(--surface-soft) 45%, var(--surface-strong)) !important;
}

.calendar-timeline-holiday {
  background: var(--accent-2-soft) !important;
}

.calendar-hour-label,
.calendar-hour-line {
  border-color: var(--line) !important;
}

.calendar-current-time-line span {
  background: var(--danger);
}

.calendar-current-time-line > span:last-child {
  background: var(--danger);
}

.calendar-event-block {
  background: var(--event-bg);
  border-left: 4px solid var(--event-accent);
  color: var(--ink) !important;
  box-shadow: var(--pill-shadow) !important;
}

.calendar-event-block[data-category="课程"] {
  background: var(--accent-2-soft);
}

.calendar-event-block[data-category="DDL"] {
  background: #fff0e8;
}

.theme-dark .calendar-event-block[data-category="DDL"] {
  background: #402c24;
}

.calendar-event-block[data-category="生活"] {
  background: #f6f9ff;
}

.theme-dark .calendar-event-block[data-category="生活"] {
  background: #342c26;
}

.calendar-empty-slot {
  background: color-mix(in srgb, var(--surface-strong) 78%, transparent) !important;
  border: 1px dashed var(--line);
}

.calendar-add-fab {
  position: fixed;
  z-index: 35;
  left: calc(50% + 128px);
  bottom: 92px;
  display: grid;
  width: 56px;
  height: 56px;
  place-items: center;
  border-radius: 999px;
  color: #fffaf5;
  background: var(--accent);
  box-shadow: 0 16px 30px rgba(120, 85, 54, 0.22);
}

.theme-dark .calendar-add-fab {
  color: #201713;
  box-shadow: 0 16px 34px rgba(0, 0, 0, 0.36);
}

@media (max-width: 430px) {
  .calendar-add-fab {
    left: auto;
    right: 22px;
  }
}
/* preview-custom-end */
